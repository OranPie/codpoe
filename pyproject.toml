[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "poecoder"
version = "0.0.3"
description = "AgentCore runtime with session conversation, nested agents, and RunShell execution"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "pydantic>=2.8.0",
  "httpx>=0.27.0",
  "fastapi-poe>=0.0.83",
  "openai>=1.55.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[project.scripts]
poecoder = "poecoder.cli:main"
poecoder-api = "poecoder.api:run"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["poecoder*"]
